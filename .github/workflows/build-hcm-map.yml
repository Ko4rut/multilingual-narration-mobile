name: Build bundled HCMC offline map
on:
  push:
    branches: [feat/hcm-required-offline-map]
    paths:
      - ".github/workflows/build-hcm-map.yml"
      - "scripts/build-hcm-pmtiles.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Create HCMC Protomaps extract
        run: node scripts/build-hcm-pmtiles.mjs
      - name: Validate archive metadata
        run: |
          test -s assets/maps/hcm-metropolitan.pmtiles
          test -s assets/maps/hcm-metropolitan.manifest.json
          docker run --rm --mount "type=bind,source=$PWD/assets/maps,target=/data" \
            ghcr.io/protomaps/go-pmtiles:v1.31.2 verify /data/hcm-metropolitan.pmtiles
      - name: Commit bundled map asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/maps/hcm-metropolitan.pmtiles assets/maps/hcm-metropolitan.manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "build(map): bundle HCMC vector PMTiles archive"
            git push
          fi
